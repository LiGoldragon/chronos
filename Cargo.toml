[package]
name         = "chronos"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.89"
license-file = "LICENSE.md"
repository   = "https://github.com/LiGoldragon/chronos"
description  = "Chronos — a daemon publishing zodiacal time, sunrise/sunset, and twilight events for the local observer."

[lib]
path = "src/lib.rs"

[[bin]]
name = "chronos"
path = "src/bin/chronos.rs"

[[bin]]
name = "chronos-daemon"
path = "src/bin/chronos_daemon.rs"

[dependencies]
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "b670c72d0c2cb94ad1e39b372271f6569d91e214" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "bfde3b878dd3de2991d7f605b59f57a13ef8f20b" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror  = "2"
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
zbus       = { version = "5", default-features = false, features = ["tokio"] }

# Astronomy — DE440 + NREL SPA + time scales (per report 49)
anise             = "0.10"
hifitime          = "4"
solar-positioning = "0.5"

# Persistence — one row: LocationSource override
redb = "4"

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "b922afba278d5e1430f0a52ce49898c3263e87bc" }
