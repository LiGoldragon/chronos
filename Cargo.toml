[package]
name         = "chronos"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license-file = "LICENSE.md"
repository   = "https://github.com/LiGoldragon/chronos"
description  = "Chronos — a daemon publishing zodiacal time, sunrise/sunset, and twilight events for the local observer."

[lib]
path = "src/lib.rs"

[[bin]]
name = "chronos"
path = "src/bin/chronos.rs"

[[bin]]
name = "chronos-daemon"
path = "src/bin/chronos_daemon.rs"

[dependencies]
# Wire & NOTA — same shape as chroma
nota-codec = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
rkyv       = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror  = "2"
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
zbus       = { version = "5", default-features = false, features = ["tokio"] }

# Astronomy — DE440 + NREL SPA + time scales (per report 49)
anise             = "0.10"
hifitime          = "4"
solar-positioning = "0.5"

# Persistence — one row: LocationSource override
redb = "4"
